<!doctype html>

<html><head><meta charset="utf-8"><title>Produto de teste</title></head>
<body><div id="p"></div><script>
setTimeout(function () {
  var v = document.createElement('video');

  document.getElementById('p').appendChild(v);
  v.play().catch(function () {});
}, 300);
</script></body></html>
